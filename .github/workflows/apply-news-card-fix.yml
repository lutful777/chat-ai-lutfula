name: Apply separate news cards

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[automation] diagnose separate news cards'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch backend and Android news rendering
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 <<'PY' > /tmp/patch.log 2>&1
          from pathlib import Path
          import re

          backend_path = Path('api/search.js')
          backend = backend_path.read_text(encoding='utf-8')
          old_image = "imageUrl: images.length ? buildGalleryUrl(req, pageUrl) : null,"
          new_image = "imageUrl: images[0]?.url || null,"
          if old_image not in backend:
              raise SystemExit('Expected gallery image assignment was not found in api/search.js')
          backend = backend.replace(old_image, new_image, 1)
          backend_path.write_text(backend, encoding='utf-8')

          vm_path = Path('app/src/main/java/com/example/ui/chat/ChatViewModel.kt')
          vm = vm_path.read_text(encoding='utf-8')
          old_loading = 'loadingText = "Searching with Vercel..."'
          if old_loading in vm:
              vm = vm.replace(
                  old_loading,
                  'loadingText = if (mode == "berita") "Mencari beberapa berita terbaru..." else "Searching with Vercel..."',
                  1
              )

          pattern = re.compile(
              r'''                    if \(mode == "berita"\) \{.*?\n                    \} else \{''',
              re.S
          )
          replacement = '''                    if (mode == "berita") {
                        val maximumNews = minOf(5, dataArray.length())
                        var insertedNews = 0

                        for (i in 0 until maximumNews) {
                            val item = dataArray.optJSONObject(i) ?: continue
                            val title = item.optString("title", "").trim()
                            val description = item.optString("description", "").trim()
                            val imageUrl = item.optString("imageUrl", null)
                                ?.takeIf { it != "null" && it.startsWith("http") }
                            val publishedAt = item.optString("publishedAt", "").trim()
                            val source = item.optString("source", "").trim()

                            if (title.isBlank() || description.isBlank()) continue

                            val content = buildString {
                                append(title)
                                append("\\n\\n")
                                append(description)
                                if (source.isNotBlank()) {
                                    append("\\n\\nSumber: ").append(source)
                                }
                                if (publishedAt.isNotBlank()) {
                                    append("\\nTerbit: ").append(publishedAt)
                                }
                            }

                            chatRepository.insertMessage(
                                MessageEntity(
                                    sessionId = sessionId,
                                    role = "assistant",
                                    content = content,
                                    articleImageUrl = imageUrl
                                )
                            )
                            insertedNews++
                        }

                        if (insertedNews == 0) {
                            chatRepository.insertMessage(
                                MessageEntity(
                                    sessionId = sessionId,
                                    role = "assistant",
                                    content = "Tidak ditemukan berita valid yang memiliki keterangan lengkap."
                                )
                            )
                        }
                    } else {'''

          vm, count = pattern.subn(replacement, vm, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Android news block, replaced {count}')
          vm_path.write_text(vm, encoding='utf-8')
          PY
          status=$?
          if [ $status -ne 0 ]; then
            printf 'Patch failed:\n\n```text\n' > /tmp/comment.txt
            tail -n 120 /tmp/patch.log >> /tmp/comment.txt
            printf '\n```\n' >> /tmp/comment.txt
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.txt
            exit $status
          fi

          rm -f api/news-gallery.js package.json
          rm -f .github/NEWS_CARD_MIGRATION_TRIGGER.md .github/NEWS_CARD_MIGRATION_TRIGGER_2.md

      - name: Run Android unit tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./gradlew testDebugUnitTest > /tmp/gradle.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            printf 'Android tests failed:\n\n```text\n' > /tmp/comment.txt
            tail -n 180 /tmp/gradle.log >> /tmp/comment.txt
            printf '\n```\n' >> /tmp/comment.txt
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.txt
            exit $status
          fi

      - name: Commit the fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-news-card-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show separate news cards with one photo each"
          git push origin main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Separate news cards applied and Android tests passed."
