name: Finalize news output v2

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/finalize-news-output-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize five-item response
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("api/search.js")
          text = path.read_text(encoding="utf-8")

          text, count1 = re.subn(
              r"\n\s*const outputArticles = isBeritaMode\s*\? \(await Promise\.all\(validArticles\.map\(translateNewsItemToIndonesian\)\)\)\.filter\(Boolean\)\s*:\s*validArticles;",
              "\n\n    const outputArticles = validArticles;",
              text,
              count=1,
          )
          if count1 == 0 and "const outputArticles = validArticles;" not in text:
              raise SystemExit("Could not replace outputArticles")

          if "completeMinimum:" not in text:
              text, count2 = re.subn(
                  r"(\n\s*translatedTo: isBeritaMode \? 'id' : null,)(\n\s*data: outputArticles)",
                  r"\1\n      minimumRequested: isBeritaMode ? 5 : null,\n      returned: outputArticles.length,\n      completeMinimum: isBeritaMode ? outputArticles.length >= 5 : null,\2",
                  text,
                  count=1,
              )
              if count2 == 0:
                  raise SystemExit("Could not add response metadata")

          path.write_text(text, encoding="utf-8")
          PY
          node --check api/search.js

      - name: Commit final response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/search.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep five translated news items"
          git push origin HEAD:main
