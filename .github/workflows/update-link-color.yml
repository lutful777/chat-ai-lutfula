name: Update chat link color

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/update-link-color.yml"

permissions:
  contents: write

jobs:
  update-color:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Change link color to sky blue
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/chat/ChatScreen.kt")
          text = path.read_text(encoding="utf-8")
          old = "val linkColor = MaterialTheme.colorScheme.primary"
          new = "val linkColor = Color(0xFF5AA9FF)"

          if old not in text and new not in text:
              raise SystemExit("Link color declaration not found")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit link color update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/chat/ChatScreen.kt

          if git diff --cached --quiet; then
            echo "Link color is already sky blue."
            exit 0
          fi

          git commit -m "style: use sky blue for chat links"
          git push origin HEAD:main
