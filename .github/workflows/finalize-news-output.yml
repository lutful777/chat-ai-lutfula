name: Finalize news output

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/finalize-news-output.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep translated five-item result set intact
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("api/search.js")
          text = path.read_text(encoding="utf-8")

          old = '''    const outputArticles = isBeritaMode
              ? (await Promise.all(validArticles.map(translateNewsItemToIndonesian))).filter(Boolean)
              : validArticles;'''
          new = '''    const outputArticles = validArticles;'''
          if old not in text and new not in text:
              raise SystemExit("outputArticles block not found")
          text = text.replace(old, new, 1)

          old_response = '''      translatedTo: isBeritaMode ? 'id' : null,
              data: outputArticles'''
          new_response = '''      translatedTo: isBeritaMode ? 'id' : null,
              minimumRequested: isBeritaMode ? 5 : null,
              returned: outputArticles.length,
              completeMinimum: isBeritaMode ? outputArticles.length >= 5 : null,
              data: outputArticles'''
          if old_response not in text and 'completeMinimum:' not in text:
              raise SystemExit("response block not found")
          text = text.replace(old_response, new_response, 1)

          path.write_text(text, encoding="utf-8")
          PY

          node --check api/search.js

      - name: Commit finalized news output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/search.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve five validated news results"
          git push origin HEAD:main
