name: Server smoke
on:
  push:
    branches: [fix/stockfish-vercel-3000ms-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/smoke-stockfish.js
