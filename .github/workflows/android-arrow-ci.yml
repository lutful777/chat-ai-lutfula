name: Android Arrow CI

on:
  push:
    branches:
      - fix/stockfish-vercel-3000ms-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode or generate debug keystore
        run: |
          if [ ! -f debug.keystore.base64 ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode(open('debug.keystore.base64', 'r').read()))"
          fi
      - name: Remove corrupt Gradle wrapper jar
        run: rm -f gradle/wrapper/gradle-wrapper.jar
      - name: Test and build with Gradle
        shell: bash
        run: |
          set -o pipefail
          gradle clean testDebugUnitTest assembleDebug --stacktrace --no-configuration-cache --no-daemon 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arrow-build-log
          path: build.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arrow
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
