name: Apply clickable chat links

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/scripts/apply_clickable_links.py"
      - ".github/workflows/apply-clickable-chat-links.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chat link rendering
        run: python3 .github/scripts/apply_clickable_links.py
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feature/clickable-chat-links
          commit-message: "feat: make normal chat links clickable"
          title: "Make normal chat links clickable"
          body: "Makes http, https, and www links in normal chat messages clickable. News cards remain link-free."
