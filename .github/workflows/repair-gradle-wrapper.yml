name: Repair Gradle wrapper once

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/repair-gradle-wrapper.yml"

permissions:
  contents: write

jobs:
  repair-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Restore official Gradle 9.3.1 wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar

          expected_blob="61285a659d17295f1de7c53e24fdf13ad755c379"
          actual_blob="$(git hash-object gradle/wrapper/gradle-wrapper.jar)"
          test "$actual_blob" = "$expected_blob"
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null

      - name: Commit repaired wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar

          if git diff --cached --quiet; then
            echo "Gradle wrapper JAR is already valid."
            exit 0
          fi

          git commit -m "fix: restore valid Gradle wrapper jar"
          git push origin HEAD:main
